events {}

http {
  upstream bogaap_api {
    server api:3001;
  }

  upstream bogaap_web {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
      proxy_pass http://bogaap_api;
    }

    location /_next/ {
      proxy_pass http://bogaap_web;
    }

    location / {
      proxy_pass http://bogaap_web;
    }
  }
}
