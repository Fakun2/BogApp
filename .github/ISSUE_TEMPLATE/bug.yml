name: Bug
description: Reportar una falla o regresion.
title: "[Bug]: "
labels: ["type:bug", "status:ready"]
body:
  - type: textarea
    id: current
    attributes:
      label: Comportamiento actual
      description: Que ocurre y donde.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Que deberia ocurrir.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Logs, capturas, errores o comandos.
  - type: dropdown
    id: area
    attributes:
      label: Area principal
      options:
        - area:api
        - area:web
        - area:database
        - area:auth
        - area:tenant
        - area:rbac
        - area:onboarding
        - area:clients
        - area:cases
        - area:documents
        - area:tasks
        - area:finance
        - area:integrations
        - area:qa
        - area:infra
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options:
        - priority:p0
        - priority:p1
        - priority:p2
        - priority:p3
    validations:
      required: true
